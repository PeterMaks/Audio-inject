name: CI & Windows Desktop Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Verify Python Lossless Engine, FFmpeg Converter, and Tauri Bridge
  # ---------------------------------------------------------------------------
  verify-python-engine:
    name: Pytest & Ruff (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Chromaprint (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libchromaprint-tools

      - name: Install FFmpeg & Chromaprint (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg chromaprint -y --no-progress

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Package & Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check src tests

      - name: Run 41-Test Pytest Suite (FLAC, MP3, WAV & NDJSON Bridge)
        run: pytest -v

  # ---------------------------------------------------------------------------
  # JOB 2: Compile Tauri v2 Windows Installers (.msi & .exe)
  # ---------------------------------------------------------------------------
  build-windows-desktop:
    name: Build Windows .msi & .exe (Tauri v2)
    needs: verify-python-engine
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust Cargo Target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri"

      - name: Install Frontend Dependencies
        working-directory: ./desktop
        run: npm install

      - name: Verify TypeScript & Vite Production Bundle
        working-directory: ./desktop
        run: npm run build

      # On branch pushes and PRs: compile .msi and .exe installers and upload as CI artifacts
      - name: Compile Tauri v2 Windows Installers (.msi and .exe)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        working-directory: ./desktop
        run: npm run tauri build -- --bundles msi,nsis

      - name: Upload Windows .msi & .exe Artifacts
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: FLAC-Meta-Injector-Windows-Installers
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # On version tags (e.g. git tag v1.0.0 && git push --tags): build & publish GitHub Release
      - name: Build & Publish GitHub Release (Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "FLAC Meta Injector ${{ github.ref_name }}"
          releaseBody: |
            ## FLAC Meta Injector ${{ github.ref_name }} — Windows Studio Edition
            ### Downloads
            - **Windows Installer (`.msi`)**: Standard Windows Installer package.
            - **Windows Setup (`.exe`)**: NSIS one-click setup executable.
          releaseDraft: false
          prerelease: false
          args: --bundles msi,nsis
