[package]
name = "flac-meta-injector-desktop"
version = "1.0.0"
description = "Native Windows Glassmorphism Desktop App for FLAC Metadata Injection"
authors = ["flac-meta-injector team"]
edition = "2021"

[lib]
name = "flac_meta_injector_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
window-vibrancy = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
